# Множество локаций с аренами.

# Плагин автоматически находит Свободную арену,
# если арена не найдена, игроку будет отправлено
# сообщение из messages.yml/messages/unable-find-arena

arenas:
  duelTeam1:
    type: TEAM
    world: duels
    # Настройка авто-очистки, если не хотите
    # использовать, уберите строки как на arena2
    auto-clear:
      # Режимы для очистки арены:
      # AVAILABLE - Когда арена свободна
      # UNAVAILABLE - Когда арена не свободна
      mode: AVAILABLE
      # Центр арены
      center: 3571427.55 124.00 7222223.57
      # Радиус очистки
      radius: 250
    # Локации спавна, не больше 2
    locations:
      1:
        x: 3571425.48
        y: 127.00
        z: 7222255.46
        pitch: -0.5
        yaw: -180.0
      2:
